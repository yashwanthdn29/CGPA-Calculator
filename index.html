<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>CGPA Calculator</h2>
        <p class="sub">Enter credits & grades for 8 subjects</p>

        <div class="subjects">
            <div class="subject-row">
                <label for="subject1-credit">Subject 1</label>
                <input type="number" id="subject1-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject1-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>

            <div class="subject-row">
                <label for="subject2-credit">Subject 2</label>
                <input type="number" id="subject2-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject2-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>

            <div class="subject-row">
                <label for="subject3-credit">Subject 3</label>
                <input type="number" id="subject3-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject3-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>

            <div class="subject-row">
                <label for="subject4-credit">Subject 4</label>
                <input type="number" id="subject4-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject4-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>

            <div class="subject-row">
                <label for="subject5-credit">Subject 5</label>
                <input type="number" id="subject5-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject5-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>

            <div class="subject-row">
                <label for="subject6-credit">Subject 6</label>
                <input type="number" id="subject6-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject6-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>

            <div class="subject-row">
                <label for="subject7-credit">Subject 7</label>
                <input type="number" id="subject7-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject7-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>

            <div class="subject-row">
                <label for="subject8-credit">Subject 8</label>
                <input type="number" id="subject8-credit" placeholder="Credits" min="0" step="1">
                <input type="number" id="subject8-grade" placeholder="Grade" min="0" max="10" step="0.1">
            </div>
        </div>

        <button onclick="calculate()">Calculate CGPA</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
